<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workout Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <style>
    /* Map container must have height */
    #map {
      height: 500px;
      width: 100%;
      margin-bottom: 20px;
    }

    /* Form styles */
    .form {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      max-width: 800px;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 5px;
    }
    .form.hidden {
      display: none;
    }
    .form__row {
      display: flex;
      flex-direction: column;
    }
    .form__row--hidden {
      display: none;
    }
    .form__input--type,
    .form__input--distance,
    .form__input--duration,
    .form__input--cadence,
    .form__input--elevation {
      padding: 8px;
      font-size: 1rem;
    }
    button[type='submit'] {
      grid-column: span 1;
      padding: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Workout list styles */
    .workouts {
      max-width: 800px;
      list-style: none;
      padding: 0;
    }
    .workout {
      background: #eee;
      margin-bottom: 10px;
      padding: 10px;
      border-left: 5px solid #1abc9c;
      border-radius: 4px;
      cursor: pointer;
    }
    .workout--running {
      border-color: #ffb545;
    }
    .workout--cycling {
      border-color: #4e8cff;
    }
    .workout__title {
      font-weight: 700;
      margin: 0 0 5px;
    }
    .workout__details {
      display: inline-block;
      margin-right: 15px;
      font-size: 0.9rem;
    }
    .workout__icon {
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <form class="form hidden">
    <div class="form__row">
      <select class="form__input--type">
        <option value="running">Running</option>
        <option value="cycling">Cycling</option>
      </select>
    </div>
    <div class="form__row">
      <input
        type="number"
        placeholder="Distance (km)"
        class="form__input--distance"
        required
      />
    </div>
    <div class="form__row">
      <input
        type="number"
        placeholder="Duration (min)"
        class="form__input--duration"
        required
      />
    </div>
    <div class="form__row">
      <input
        type="number"
        placeholder="Cadence (step/min)"
        class="form__input--cadence"
        required
      />
    </div>
    <div class="form__row form__row--hidden">
      <input
        type="number"
        placeholder="Elevation (meters)"
        class="form__input--elevation"
      />
    </div>
    <button type="submit">Add workout</button>
  </form>

  <ul class="workouts"></ul>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Your JS file -->
  <script src="app.js"></script>
</body>
</html>
